name: Build Meu Suporte APK

on:
  workflow_dispatch:
  push:
    branches:
      - meu-suporte-android
    paths:
      - 'Meu-Suporte-Android/**'
      - '.github/workflows/build-meu-suporte-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    defaults:
      run:
        working-directory: Meu-Suporte-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Restore fixed development signing key
        run: |
          mkdir -p keystore
          base64 -d keystore/meusuporte-dev.keystore.b64 > keystore/meusuporte-dev.keystore
      - name: Restore Firebase config when configured
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Print signing fingerprint
        run: keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -A 2 'Certificate fingerprints'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Suporte-Android-debug
          path: Meu-Suporte-Android/app/build/outputs/apk/debug/app-debug.apk
