name: Build Meu Suporte Cliente APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'Meu-Suporte-Cliente-Android/**'
      - '.github/workflows/build-meu-suporte-cliente-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Meu-Suporte-Cliente-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Build release AAB
        run: gradle bundleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Suporte-Onlline-debug
          path: Meu-Suporte-Cliente-Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Suporte-Onlline-release-aab
          path: Meu-Suporte-Cliente-Android/app/build/outputs/bundle/release/app-release.aab
